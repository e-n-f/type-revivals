name: Font versions
on:
  pull_request:
    paths: ['**/*.otf', '**/*.ttf']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - run: python3 scripts/check_font_versions.py origin/${{ github.base_ref }}
